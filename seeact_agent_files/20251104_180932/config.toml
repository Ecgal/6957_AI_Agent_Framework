[basic]
save_file_dir = "seeact_agent_files"
default_task = "Return to me the lowest price stay in Cairo, Egypt. I am not concerned with dates, there will be two travelers"
default_website = "http://localhost:8080/environments/05_Travel_General_Expedia/AIA.html"
crawler_mode = false
crawler_max_steps = 10

[agent]
input_info = [ "screenshot",]
grounding_strategy = "text_choice_som"
max_auto_op = 50
max_continuous_no_op = 5
highlight = false

[openai]
rate_limit = -1
model = "gpt-4o"
temperature = 0.9
api_key = "Your API key here"

[browser]
headless = false
args = []
browser_app = "chrome"
persistant = false
persistant_user_path = ""
save_video = false
tracing = false

[browser.viewport]
width = 1280
height = 720

[browser.trace]
screenshots = true
snapshots = true
sources = true
